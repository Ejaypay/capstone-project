<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Discover | Gunpla Hub</title>

  <link rel="stylesheet" href="css/discover.css" />
</head>

<body>
  <header class="topbar">
    <a href="index.html" class="top-logo">
      <span>GUNPLA</span> HUB
    </a>

    <nav class="top-nav">
      <a href="discover.html" class="active">⌂ Discover</a>
      <a href="store.html">▦ Store</a>
      <a href="#">▣ Events</a>
      <a href="#">▤ Receipts</a>
      <a href="#">⌘ Scan QR</a>
      <a href="#">◉ Points</a>
      <a href="#">♛ Reward</a>
    </nav>

    <div class="top-actions">
      <div class="role-switch">
        <button class="role-btn active" id="buyerBtn">Buyer</button>
        <button class="role-btn" id="sellerBtn">Seller</button>
      </div>

      <button class="profile-btn" id="profileBtn">●</button>
    </div>
  </header>

  <main class="discover-page">
    <div class="search-row">
      <input type="text" id="discoverSearch" placeholder="SEARCH" />
    </div>

    <section class="carousel-area">
      <button class="arrow-btn" id="prevBtn">❮</button>

      <div class="carousel" id="carousel"></div>

      <button class="arrow-btn" id="nextBtn">❯</button>
    </section>

    <div class="see-more-row">
      <button id="seeMoreBtn" class="see-more-btn">SEE MORE</button>
    </div>
  </main>

  <div class="modal" id="discoverModal">
    <div class="modal-box">
      <button class="close-modal" id="closeModal">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/discover.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Gunpla Hub</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-body">
  <main class="auth-page">
    <a class="auth-logo" href="index.html">
      <span class="logo-red">GUNPLA</span>
      <span class="logo-white">HUB</span>
    </a>

    <section class="auth-shell">
      <div class="auth-art">
        <img src="images/mecha-center.svg" alt="Gunpla mecha model" />

        <div class="auth-art-caption">
          <h2>HI THERE!</h2>
          <p>Join us and enjoy rewards.</p>
        </div>
      </div>

      <div class="auth-panel">
        <h1 id="authTitle">WELCOME BACK!</h1>

        <p class="auth-switch-text">
          <span id="authSubtitle">Don't have an account?</span>
          <button id="switchAuthMode">Sign Up</button>
        </p>

        <div class="auth-tabs">
          <button class="auth-tab" id="registerTab">REGISTRATION</button>
          <span>/</span>
          <button class="auth-tab active" id="loginTab">LOGIN</button>
        </div>

        <form class="auth-form active" id="loginForm">
          <label for="loginUsername">Username</label>
          <input id="loginUsername" type="text" required />

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required />

          <div class="auth-options">
            <label class="remember-label">
              <input type="checkbox" checked />
              Remember me
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button class="auth-submit" type="submit">LOGIN</button>

          <button class="auth-link-button" type="button" id="openRegisterFromLogin">
            SIGN UP
          </button>
        </form>

        <form class="auth-form" id="registerForm">
          <label for="registerName">Full Name</label>
          <input id="registerName" type="text" required />

          <label for="registerUsername">Username</label>
          <input id="registerUsername" type="text" required />

          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" required />

          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" required />

          <button class="auth-submit" type="submit">CREATE ACCOUNT</button>

          <button class="auth-link-button" type="button" id="openLoginFromRegister">
            BACK TO LOGIN
          </button>
        </form>

        <div class="auth-socials">
          <button aria-label="Email login">M</button>
          <button aria-label="Facebook login">f</button>
          <button aria-label="Instagram login">◎</button>
          <button aria-label="Google login">G</button>
        </div>

        <p class="auth-message" id="authMessage"></p>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

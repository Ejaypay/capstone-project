<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Gunpla Hub</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-body">
  <main class="auth-page">
    <a href="index.html" class="auth-logo">
      <span>GUNPLA</span> HUB
    </a>

    <section class="auth-wrapper">
      <div class="auth-image-panel">
        <img src="images/mecha-center.svg" alt="Gunpla mecha" />

        <div class="auth-caption">
          <h2>HI THERE!</h2>
          <p>Join us and enjoy rewards.</p>
        </div>
      </div>

      <div class="auth-form-panel">
        <h1 id="authTitle">WELCOME BACK!</h1>

        <p class="auth-subtitle">
          <span id="authSubtitle">Don't have an account?</span>
          <button id="switchModeBtn">Sign Up</button>
        </p>

        <div class="auth-tabs">
          <button id="registerTab">REGISTRATION</button>
          <span>/</span>
          <button id="loginTab" class="active">LOGIN</button>
        </div>

        <form id="loginForm" class="auth-form active">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" required />

          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required />

          <div class="auth-options">
            <label>
              <input type="checkbox" checked />
              Remember me
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-submit">LOGIN</button>
          <button type="button" class="auth-link" id="openRegisterBtn">SIGN UP</button>
        </form>

        <form id="registerForm" class="auth-form">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" required />

          <label for="registerUsername">Username</label>
          <input type="text" id="registerUsername" required />

          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" required />

          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" required />

          <button type="submit" class="auth-submit">CREATE ACCOUNT</button>
          <button type="button" class="auth-link" id="openLoginBtn">BACK TO LOGIN</button>
        </form>

        <div class="auth-socials">
          <button>M</button>
          <button>f</button>
          <button>◎</button>
          <button>G</button>
        </div>

        <p id="authMessage" class="auth-message"></p>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
